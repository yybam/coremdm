name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "firebase.json"
      - ".firebaserc"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Project comes from .firebaserc already in this repo; the service account JSON in the
      # FIREBASE_SERVICE_ACCOUNT secret determines which project it deploys to.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
