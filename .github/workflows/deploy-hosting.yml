name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-hosting.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Project comes from .firebaserc already in this repo; the FIREBASE_SERVICE_ACCOUNT
      # secret (a Firebase Admin SDK service account key, added via repo Settings > Secrets)
      # determines which project it authenticates as. Switched here from a keyless
      # Workload Identity Federation setup -- that approach is more secure (no long-lived
      # key at all) but its one-time gcloud setup needs a working Google OAuth token
      # exchange, which a transparent network proxy on the machine doing that setup was
      # actively breaking (serving the wrong certificate for oauth2.googleapis.com,
      # unfixable client-side). This key-based approach only needs the Firebase Console
      # (a normal browser page), so it sidesteps that entirely.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
